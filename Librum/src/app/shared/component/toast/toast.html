@if (mensagem(); as mensagem) {
  <div class="toast-box" [style.border-left-color]="'var(--bs-' + mensagem.cor + ')'" role="status" aria-live="polite">
    <div class="d-flex align-items-start gap-3 p-3">
      <i class="bi {{ mensagem.icone }} toast-icone text-{{ mensagem.cor }}" aria-hidden="true"></i>
      <div class="flex-grow-1">
        <p class="fw-semibold mb-0">{{ mensagem.titulo }}</p>
        <p class="text-body-secondary small mb-0">{{ mensagem.texto }}</p>
      </div>
      <button type="button" class="btn-close btn-close-sm flex-shrink-0" aria-label="Fechar notificação"
        (click)="toast.fechar()"></button>
    </div>
    <!-- quanto tempo falta para fechar sozinho -->
    <div class="toast-tempo bg-{{ mensagem.cor }}" [style.animation-duration.ms]="duracaoMs"></div>
  </div>
}

<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;">
  <div *ngFor="let toast of toasts" class="toast show" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header {{ getToastClass(toast.type) }}">
      <strong class="me-auto" *ngIf="toast.title">{{ toast.title }}</strong>
      <small class="text-muted" *ngIf="!toast.title">{{ toast.type | titlecase }}</small>
      <button type="button" class="btn-close btn-close-white" (click)="removeToast(toast.id)" aria-label="Close"></button>
    </div>
    <div class="toast-body">
      {{ toast.message }}
    </div>
  </div>
</div>

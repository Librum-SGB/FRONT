<div class="layout d-flex flex-column min-vh-100">
  <!-- Navbar -->
  <app-navbar
    *ngIf="!isAuthRoute()"
    (toggleSidebar)="alternarSidebar()"
  ></app-navbar>

  <!-- Corpo do sistema -->
  <div
    *ngIf="!isAuthRoute()"
    class="layout-corpo d-flex flex-grow-1 position-relative"
  >
    <!-- Fundo escuro do menu mobile -->
    <div
      *ngIf="menuMobileAberto"
      class="menu-overlay"
      (click)="fecharMenuMobile()"
      aria-label="Fechar menu"
    ></div>

    <!-- Menu lateral -->
    <app-barra-lateral
      class="sidebar-container flex-shrink-0"
      [recolhida]="sidebarRecolhida"
      [mobileAberto]="menuMobileAberto"
      [class.mobile-aberto]="menuMobileAberto"
      (navegar)="fecharMenuMobile()"
      (sair)="logout()"
      (toggleSidebar)="alternarSidebar()"
    ></app-barra-lateral>

    <!-- Conteúdo -->
    <main class="conteudo-principal flex-grow-1 p-3 px-5 pb-5">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Telas de autenticação -->
  <main *ngIf="isAuthRoute()" class="flex-grow-1">
    <router-outlet></router-outlet>
  </main>

  <!-- Rodapé -->
  <app-footer *ngIf="!isAuthRoute()"></app-footer>

  <!-- Notificações -->
  <app-toast></app-toast>
</div>

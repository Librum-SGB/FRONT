<app-corpo-padrao>
  <div class="titulo">Usuários</div>

  <div class="corpo">
    <lbr-filtros [config]="configFiltro()" [(valores)]="filtros">
      @if (podeCriar) {
        <a lbrFiltrosAcoes lbrButton variant="cadastrar" routerLink="/cadastrar-usuario" class="text-nowrap">
          <i class="bi bi-person-plus" aria-hidden="true"></i>
          Cadastrar Usuário
        </a>
      }
    </lbr-filtros>

    <lbr-tabela
      [dados]="usuariosFiltrados()"
      [carregando]="carregando()"
      mensagemCarregando="Carregando usuários..."
      [mensagemVazio]="temFiltroAtivo(filtros()) ? 'Nenhum usuário encontrado para os filtros selecionados.' : 'Nenhum usuário cadastrado.'"
      iconeVazio="bi-people"
      rotulo="Paginação dos usuários">
      <ng-template lbrTabelaCabecalho>
        <th scope="col" lbrOrdenar="id">ID</th>
        <th scope="col" lbrOrdenar="nome">Usuário</th>
        <th scope="col" lbrOrdenar="email">E-mail</th>
        <th scope="col" [lbrOrdenar]="rotuloSituacao">Status</th>
        <th scope="col" class="text-end">Ações</th>
      </ng-template>
      <ng-template [lbrTabelaLinha]="usuariosFiltrados()" let-usuario>
        <tr>
          <th scope="row">#{{ usuario.id }}</th>
          <td>
            <div class="d-flex align-items-center gap-2">
              @if (usuario.foto) {
                <img [src]="usuario.foto" alt="" class="rounded-circle avatar-tabela">
              } @else {
                <i class="bi bi-person-circle fs-4 text-secondary" aria-hidden="true"></i>
              }
              <lbr-link-entidade class="fw-semibold" tipo="usuario" [id]="usuario.id" [texto]="usuario.nome" />
            </div>
          </td>
          <td>{{ usuario.email }}</td>
          <td>
            <app-badge [status]="corSituacao(usuario)">{{ rotuloSituacao(usuario) }}</app-badge>
          </td>
          <td class="text-end">
            <lbr-acoes [acoes]="acoesDoUsuario(usuario)" [descricao]="usuario.nome" />
          </td>
        </tr>
      </ng-template>
    </lbr-tabela>
  </div>
</app-corpo-padrao>

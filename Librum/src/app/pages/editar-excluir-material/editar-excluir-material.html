<app-corpo-padrao>
  <div class="titulo">Materiais</div>

  <div class="corpo">
    <lbr-filtros [config]="configFiltro()" [(valores)]="filtros">
      <a lbrFiltrosAcoes lbrButton variant="cadastrar" routerLink="/cadastrarMaterial" class="text-nowrap">
        <i class="bi bi-plus-lg" aria-hidden="true"></i>
        Cadastrar Material
      </a>
    </lbr-filtros>

    <lbr-tabela
      [dados]="materiaisFiltrados()"
      [carregando]="carregando()"
      mensagemCarregando="Carregando materiais..."
      [mensagemVazio]="temFiltroAtivo(filtros()) ? 'Nenhum material encontrado para os filtros selecionados.' : 'Nenhum material cadastrado.'"
      iconeVazio="bi-book"
      rotulo="Paginação dos materiais">
      <ng-template lbrTabelaCabecalho>
        <th scope="col" lbrOrdenar="id">Código</th>
        <th scope="col" lbrOrdenar="titulo">Título</th>
        <th scope="col" lbrOrdenar="autorNome">Autor</th>
        <th scope="col" lbrOrdenar="tipoLabel">Tipo</th>
        <th scope="col" lbrOrdenar="disponibilidade">Disponibilidade</th>
        <th scope="col" class="text-end">Ações</th>
      </ng-template>
      <ng-template [lbrTabelaLinha]="materiaisFiltrados()" let-material>
        <tr>
          <th scope="row" class="text-nowrap">{{ material.codigo }}</th>
          <td>
            <lbr-link-entidade class="fw-semibold" tipo="material" [id]="material.id" [texto]="material.titulo" />
          </td>
          <td>{{ material.autorNome }}</td>
          <td>
            <lbr-badge [variant]="material.tipoVariant">{{ material.tipoLabel }}</lbr-badge>
          </td>
          <td>
            @if (material.disponibilidadeVariant) {
              <lbr-badge [variant]="material.disponibilidadeVariant">{{ material.disponibilidade }}</lbr-badge>
            } @else {
              <span class="text-secondary">—</span>
            }
          </td>
          <td class="text-end">
            <lbr-acoes [acoes]="acoesDoMaterial(material)" [descricao]="material.titulo" />
          </td>
        </tr>
      </ng-template>
    </lbr-tabela>
  </div>
</app-corpo-padrao>

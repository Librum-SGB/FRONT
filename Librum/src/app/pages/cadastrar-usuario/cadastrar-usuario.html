<div class="container mt-4">
  <div class="card p-4 shadow-sm">

    <h5 class="mb-4">Cadastrar Novo Usuário</h5>

    <div class="row mb-3">
      <div class="col-md-8">
        <label>ID do Usuário</label>
        <input type="text" class="form-control" [value]="usuario.id" disabled>
      </div>

      <div class="col-md-4 text-center">
        <label>Foto</label>
        <div class="border p-3 rounded">
          <input type="file" (change)="onFileSelect($event)" class="form-control">
        </div>
      </div>
    </div>

    <h6 class="mt-3">Dados Pessoais</h6>

    <div class="mb-3">
      <label>Nome Completo *</label>
      <input type="text" class="form-control" [(ngModel)]="usuario.nome" required>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label>Data de Nascimento *</label>
        <input type="date" class="form-control" [(ngModel)]="usuario.dataNascimento" required>
      </div>

      <div class="col-md-6">
        <label>CPF *</label>
        <input type="text" class="form-control" [(ngModel)]="usuario.cpf" required>
      </div>
    </div>

    <h6>Contato</h6>

    <div class="mb-3">
      <label>Endereço *</label>
      <input type="text" class="form-control" [(ngModel)]="usuario.endereco" required>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label>Telefone *</label>
        <input type="text" class="form-control" [(ngModel)]="usuario.telefone" required>
      </div>

      <div class="col-md-6">
        <label>Email *</label>
        <input type="email" class="form-control" [(ngModel)]="usuario.email" required>
      </div>
    </div>

    <h6>Informações da Conta</h6>

    <div class="row mb-3">
      <div class="col-md-6">
        <label>Data de Cadastro</label>
        <input type="text" class="form-control" [value]="usuario.dataCadastro" disabled>
      </div>

      <div class="col-md-6">
        <label>Tipo de Cliente *</label>
        <select class="form-select" [(ngModel)]="usuario.tipoCliente" required>
          <option value="">Selecione...</option>
          <option value="estudante">Estudante</option>
          <option value="professor">Professor</option>
          <option value="outro">Outro</option>
        </select>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label>Senha *</label>
        <input type="password" class="form-control" [(ngModel)]="usuario.senha" required>
      </div>

      <div class="col-md-6">
        <label>Confirmar Senha *</label>
        <input type="password" class="form-control" [(ngModel)]="confirmarSenha" required>
      </div>
    </div>

    <div class="mb-3">
      <label>Status</label>
      <input type="text" class="form-control" [value]="usuario.status" disabled>
    </div>

    <div class="mb-3">
      <label>Observação</label>
      <textarea class="form-control" rows="3" [(ngModel)]="usuario.observacao"></textarea>
    </div>

    <div class="d-flex justify-content-end gap-2">
      <button class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
      <button class="btn btn-primary" (click)="salvar()">Salvar</button>
    </div>

  </div>
</div>

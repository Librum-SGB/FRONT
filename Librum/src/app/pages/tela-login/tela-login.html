<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container-fluid vh-100 d-flex align-items-center justify-content-center bg-primary text-body">

  <!-- Título -->
  <div class="text-center text-body position-absolute top-0 mt-5">
    <h2>Librum</h2>
    <p>Sistema de Gerenciamento</p>
  </div>

  <!-- Card -->
  <div class="card p-4 shadow" style="width: 350px; border-radius: 12px;">
    
    <h5 class="text-center mb-4 text-secondary">Acessar Sistema</h5>

    <!-- Email -->
    <div class="mb-3">
      <label class="form-label text-secondary">Email</label>
      <input type="email" class="form-control" placeholder="seu@email.com" [(ngModel)]="email">
    </div>

    <!-- Senha -->
    <div class="mb-3">
      <label class="form-label text-secondary">Senha</label>

      <div class="input-group">
        <input [type]="mostrarSenha ? 'text' : 'password'" 
               class="form-control" 
               placeholder="Digite sua senha"
               [(ngModel)]="senha">

        <button class="btn btn-outline-secondary" type="button" (click)="toggleSenha()">
          👁
        </button>
      </div>
    </div>

    <!-- Botão -->
    <button class="btn btn-secondary w-100" (click)="entrar()">
      Entrar no Sistema
    </button>

    <div class="text-center mt-3">
      <a href="#" class="small">Esqueci minha senha</a>
      <p class="small mt-2 text-secondary">Não tem acesso? Fale com o administrador</p>
    </div>

  </div>

</div>

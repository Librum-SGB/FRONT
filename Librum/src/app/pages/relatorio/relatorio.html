<app-corpo-padrao>
  <div class="titulo">
    Relatórios
  </div>

  <div class="subtitulo">
    Unidade São Paulo - Centro
  </div>

  <div class="corpo">
    <form [formGroup]="formRelatorio" (ngSubmit)="gerarRelatorio()">

      <div class="row">
        <!-- Tipos de dados -->
        <div class="col-md-7 mb-3">
          <label class="form-label">Tipos de dados *</label>

          <app-select-pesquisavel [itens]="tiposRelatorio" [multiplo]="true" [(ngModel)]="tiposSelecionados"
            [ngModelOptions]="{ standalone: true }" placeholder="Digite para buscar tipos de dados...">
          </app-select-pesquisavel>
        </div>

        <!-- Data inicial -->
        <div class="col-md-2 mb-3">
          <label class="form-label">Data início *</label>

          <input type="date" class="form-control" formControlName="dataInicio"
            [class.is-invalid]="isInvalido(formRelatorio, 'dataInicio')" />
        </div>

        <!-- Data final -->
        <div class="col-md-3 mb-3">
          <label class="form-label">Data fim *</label>

          <input type="date" class="form-control" formControlName="dataFim"
            [class.is-invalid]="isInvalido(formRelatorio, 'dataFim')" />
        </div>
      </div>

      <!-- Avisos de validação -->
      @if (mensagensErro.length > 0) {
      <app-alerta-erros [mensagens]="mensagensErro">
      </app-alerta-erros>
      }

      <hr class="my-4">

      <!-- Botões -->
      <div class="d-flex justify-content-end gap-2">
        <button type="button" lbrButton variant="cancela/limpa" (click)="limpar()">
          Limpar
        </button>

        <button type="submit" lbrButton variant="cadastrar">
          Gerar relatório
        </button>
      </div>

    </form>
  </div>
</app-corpo-padrao>

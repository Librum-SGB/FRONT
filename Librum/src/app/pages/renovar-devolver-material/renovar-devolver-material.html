<app-corpo-padrao>
  <div class="titulo">Renovar / Devolver Materiais</div>

  <div class="corpo">
    @if (erroCarregamento) {
      <div class="alert alert-danger" role="alert">
        {{ erroCarregamento }}
        <button type="button" class="btn btn-sm btn-outline-danger ms-2" (click)="carregarEmprestimos()">
          Tentar novamente
        </button>
      </div>
    }

    <lbr-filtros [config]="configFiltro()" [(valores)]="filtros" />

    <div class="mb-4">
      <h2 class="h5 mb-3">Empréstimos em aberto</h2>
      <lbr-tabela
        [dados]="emprestimosFiltrados()"
        [carregando]="carregando"
        mensagemCarregando="Carregando empréstimos..."
        iconeVazio="bi-journal-check"
        rotulo="Paginação dos empréstimos"
        [mensagemVazio]="temFiltroAtivo(filtros()) ? 'Nenhum empréstimo encontrado para os filtros selecionados.' : 'Não há empréstimos em aberto.'">
        <ng-template lbrTabelaCabecalho>
          <th scope="col" lbrOrdenar="id">ID</th>
          <th scope="col" lbrOrdenar="usuarioNome">Usuário</th>
          <th scope="col" lbrOrdenar="materialTitulo">Material</th>
          <th scope="col" lbrOrdenar="dataDevolucaoPrevista">Devolução prevista</th>
          <th scope="col" [lbrOrdenar]="rotuloSituacao">Status</th>
          <th scope="col" class="text-end">Ações</th>
        </ng-template>
        <ng-template [lbrTabelaLinha]="emprestimosFiltrados()" let-emprestimo>
          <tr>
            <th scope="row">#{{ emprestimo.id }}</th>
            <td><lbr-link-entidade tipo="usuario" [id]="emprestimo.usuarioId" [texto]="emprestimo.usuarioNome" /></td>
            <td><lbr-link-entidade tipo="material" [id]="emprestimo.materialId" [texto]="emprestimo.materialTitulo" /></td>
            <td>{{ formatarData(emprestimo.dataDevolucaoPrevista) }}</td>
            <td>
              <app-badge [status]="corSituacao(emprestimo)">
                {{ rotuloSituacao(emprestimo) }}
              </app-badge>
            </td>
            <td class="text-end">
              <lbr-acoes [acoes]="acoesDoEmprestimo(emprestimo)" [descricao]="'empréstimo #' + emprestimo.id" />
            </td>
          </tr>
        </ng-template>
      </lbr-tabela>
    </div>
  </div>
</app-corpo-padrao>

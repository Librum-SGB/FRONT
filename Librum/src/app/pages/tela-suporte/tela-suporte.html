<div class="container py-4">
  <h4 class="mb-4">Central de Suporte</h4>

  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card p-3 border-0 shadow-sm card-contato-azul">
        <h6 class="mb-1"><i class="bi bi-telephone me-2"></i>Telefone</h6>
        <p class="small mb-0">(11) 3555-5000</p>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card p-3 border-0 shadow-sm card-contato-verde">
        <h6 class="mb-1"><i class="bi bi-envelope me-2"></i>Email</h6>
        <p class="small mb-0">suporte@senai.br</p>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card p-3 border-0 shadow-sm card-contato-roxo">
        <h6 class="mb-1"><i class="bi bi-chat-dots me-2"></i>Chat</h6>
        <button class="btn-chat-suporte">Iniciar Chat</button>
      </div>
    </div>
  </div>

  <div class="card p-4 border-0 shadow-sm mb-4">
    <h6 class="mb-3"><i class="bi bi-pencil-square me-2"></i>Enviar Mensagem</h6>
    <form [formGroup]="supportForm" (ngSubmit)="enviarMensagem()">
      <div class="mb-3">
        <label class="form-label small text-secondary">Assunto</label>
        <select class="form-select" formControlName="assunto">
          <option value="">Selecione um assunto...</option>
          <option value="duvida">Dúvida</option>
          <option value="erro">Erro</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label small text-secondary">Mensagem</label>
        <textarea class="form-control" rows="3" formControlName="mensagem" placeholder="Como podemos ajudar?"></textarea>
      </div>
      <button type="submit" class="btn-enviar-suporte" [disabled]="supportForm.invalid">
        Enviar Mensagem
      </button>
    </form>
  </div>

  <div class="mb-4">
    <h6 class="mb-3 faq-title"><i class="bi bi-question-circle me-2"></i>Perguntas Frequentes</h6>
    <div class="list-group shadow-sm">
      <div *ngFor="let item of faqs; let i = index" class="list-group-item list-group-item-action" (click)="toggleFaq(i)">
        <div class="d-flex justify-content-between align-items-center">
          <span class="small fw-medium">{{ item.question }}</span>
          <i class="bi" [class.bi-chevron-down]="!item.open" [class.bi-chevron-up]="item.open"></i>
        </div>
        <div *ngIf="item.open" class="mt-2 small text-secondary">
          {{ item.answer }}
        </div>
      </div>
    </div>
  </div>
</div>
